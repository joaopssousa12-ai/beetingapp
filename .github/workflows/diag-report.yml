name: diag-report

# One-shot (Part A): pull the read-only /api/diag/report JSON from production.
# Falls back to already-deployed endpoints (value-bets, bets, collection log,
# quota) so partial live data is available even if the new endpoint hasn't
# deployed yet. No credits, no writes.
on:
  workflow_dispatch: {}

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch diagnostic report (+ fallbacks)
        run: |
          B=https://beetingapp-1.onrender.com
          echo "===== /api/diag/report (new endpoint) ====="
          curl -sS -m 120 -w "\nHTTP %{http_code}\n" "$B/api/diag/report" || true
          echo
          echo "===== FALLBACK /api/value-bets (current window) ====="
          curl -sS -m 90 "$B/api/value-bets" | python3 -c 'import sys,json; d=json.load(sys.stdin); print("events:",len(d)); import collections; print("sports:",dict(collections.Counter(b.get("sport_name") for b in d)))' || true
          echo "===== FALLBACK /api/diag/quota ====="
          curl -sS -m 60 "$B/api/diag/quota" || true
          echo
          echo "===== FALLBACK /api/collection/log ====="
          curl -sS -m 60 "$B/api/collection/log" || true
